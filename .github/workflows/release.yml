name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: test "$GITHUB_REF_NAME" = "v$(jq -r .version manifest.json)"
      - run: git archive -o "tab-triage-${GITHUB_REF_NAME#v}.zip" HEAD manifest.json '*.js' '*.html' '*.css' LICENSE
      - run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes tab-triage-*.zip
        env:
          GH_TOKEN: ${{ github.token }}
