<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Triage</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<header>
  <h1>Tab Triage <span class="n" id="summary"></span></h1>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Filter title or URL (regex ok)">
    <label>Group <select id="group">
      <option value="domain">Domain</option><option value="window">Window</option>
      <option value="reason">Close reason</option><option value="none">None</option>
    </select></label>
    <label>Sort <select id="sort">
      <option value="order">Tab order</option><option value="oldest">Least recently viewed</option>
    </select></label>
    <label>Stale after <select id="stale">
      <option value="7">7 days</option><option value="14" selected>14 days</option>
      <option value="30">30 days</option><option value="60">60 days</option>
    </select></label>
    <select id="win"><option value="">All windows</option></select>
    <label><input type="checkbox" id="onlyCand"> Candidates only</label>
  </div>
  <div class="controls">
    <button id="refresh">Refresh</button>
    <button id="copy">Copy checked URLs</button>
    <button id="checkVis">Check visible</button>
    <button id="clear">Uncheck all</button>
    <input type="password" id="token" placeholder="GitHub token (optional)">
    <span class="note" id="ghStatus"></span>
  </div>
</header>
<main id="list"></main>
<script src="dashboard.js"></script>
</body>
</html>
